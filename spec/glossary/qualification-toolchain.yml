term: Qualification Toolchain
text: |
  This term defines the tools of the
  [specthings project](https://github.com/specthings). The tools work on
  specification items, which hold the requirements, the interfaces, the
  validation tests and the build steps of a software product. They provide the
  following functions:

  - Verify the format and the content of the specification items.

  - Generate the interface source code, the validation tests and the
    documentation from the specification items.

  - Run the tests on a target or a simulator and evaluate the test reports and
    the code coverage.

  - Build a ${/glossary/qdp:/term} from the sources. The build includes the
    static analysis, the traceability, the metrics and a digest of each artifact.
