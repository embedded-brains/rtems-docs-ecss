term: functional view
text: |
  The view of a ${logical-model:/term} which shows what each part of the
  software shall do, from the top down.  In this project, the requirements of
  the interface groups and the functional requirements give it.  They refine
  the entities of the ${structural-view:/term}.  It corresponds to the
  functional model of a method which ECSS-E-HB-40A names as an example of a
  logical model ${/ref/ecss/e-hb-40a:/cite}.
type: glossary
