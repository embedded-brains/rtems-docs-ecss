term: skip reason
text: |
  The reason why a combination of ${pre-condition:/term} states cannot occur.
  An entry of a ${transition-map:/term} with a skip reason causes no test run.
  It corresponds to a constraint of the category-partition method, which
  removes an impossible combination of choices
  ${/ref/research/ostrand-1988-cp:/cite}.
