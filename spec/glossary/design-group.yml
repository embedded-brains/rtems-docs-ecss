term: design group
text: |
  A requirement which states that the software architecture has a component for
  one module.  Its identifier names the Doxygen group of the module, so that
  the ${softwareunit:/plural} of the module trace to it.  The
  ${action-requirement:/plural} of the implementation layers refine the design
  group of their module.
type: glossary
