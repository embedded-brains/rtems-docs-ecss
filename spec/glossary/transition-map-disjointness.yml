term: transition map disjointness
text: |
  The property of a ${transition-map:/term} that no combination of
  ${pre-condition:/term} states has two entries for the same configuration.
  The tools check it, together with the ${transition-map-coverage:/term}.  With
  pre-conditions whose states exclude each other, it makes the requirements
  consistent in the sense of the ${faa:/term} requirements handbook
  ${/ref/research/lempia-2009-remh:/cite}: they assign only one value for every
  system state.
type: glossary
